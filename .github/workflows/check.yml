name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the native binding and SDK
        run: |
          python -m pip install --only-binary=bedrock-protocol '.[nethernet,raknet,mcp]'
      - name: Test the SDK
        run: python -m scripts.run_test_shard ${{ strategy.job-index }} ${{ strategy.job-total }}
      - name: Run the offline example
        if: matrix.shard == 1
        run: python examples/network_settings.py
