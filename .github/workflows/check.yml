name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the native binding and SDK
        run: |
          python -m pip install --only-binary=bedrock-protocol '.[nethernet,raknet,mcp]'
      - name: Test the SDK and run the offline example
        run: |
          python -m unittest discover -s tests -v
          python examples/network_settings.py
