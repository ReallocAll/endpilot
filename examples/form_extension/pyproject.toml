[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endpilot-action-form-mcp"
version = "0.0.0.dev0"
description = "External action-form MCP tools using EndPilot's public packet API"
requires-python = ">=3.12"
dependencies = ["endpilot", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
