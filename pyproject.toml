[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endpilot"
version = "0.0.0.dev0"
description = "Python SDK for headless Minecraft Bedrock clients"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["bedrock-protocol==0.5.0.dev0", "cryptography>=43"]

[project.optional-dependencies]
nethernet = ["nethernet[http] @ git+https://github.com/EndstoneMC/nethernet-python.git@b51ab0fc095ae2562bcbb3de911a392b86b2b335"]
raknet = ["raknet>=0.4.0"]
mcp = ["mcp>=2,<3"]

[project.urls]
Repository = "https://github.com/ReallocAll/endpilot"

[tool.setuptools.packages.find]
where = ["src"]
