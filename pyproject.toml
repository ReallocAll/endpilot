[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endpilot"
version = "0.1.0"
description = "Asynchronous Python bot framework for Minecraft: Bedrock Edition"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "bedrock-protocol-native==0.5.0",
    "nethernet[http] @ git+https://github.com/ReallocAll/nethernet-python.git@1fd9b9907e602c3b906ad45abe856ea8e9358861",
    "aiortc==1.15.0",
    "aioice==0.10.2",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.4"]
raknet = ["raknet==0.4.0"]

[project.urls]
Repository = "https://github.com/ReallocAll/endpilot"

[tool.hatch.build.targets.wheel]
packages = ["src/endpilot"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/endpilot/**",
    "/tests/python/**",
    "/tests/conftest.py",
    "/tests/integration/nethernet/test_transport.py",
    "/tests/integration/raknet/**",
    "/examples/*.py",
    "/README.md",
    "/docs/api.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
